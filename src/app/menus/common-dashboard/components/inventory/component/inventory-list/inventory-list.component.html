<nz-row [nzGutter]="[16, 16]">
  <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
    <nz-card>
      <nz-statistic nzTitle="Total Stock Value" [nzValue]="totalStockValue" nzPrefix="Rs."></nz-statistic>
    </nz-card>
  </nz-col>
  <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
    <nz-card>
      <nz-statistic nzTitle="Products Tracked" [nzValue]="rows.length"></nz-statistic>
    </nz-card>
  </nz-col>
  <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
    <nz-card>
      <nz-statistic
        nzTitle="Low Stock Alerts"
        [nzValue]="lowStockCount"
        [nzValueStyle]="{ color: '#dc2626' }"
      ></nz-statistic>
    </nz-card>
  </nz-col>
</nz-row>

<nz-card class="mt-3" nzHoverable>
  <form nz-form [formGroup]="filterForm">
    <input nz-input formControlName="search" placeholder="Search item, SKU or category" />
  </form>

  <nz-table [nzData]="filteredRows" nzSize="middle" class="mt-2">
    <thead>
      <tr>
        <th>SKU</th>
        <th>Item</th>
        <th>Category</th>
        <th nzAlign="right">Price</th>
        <th nzAlign="right">On Hand</th>
        <th nzAlign="right">Reorder Level</th>
        <th>Status</th>
        <th nzAlign="center">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of filteredRows">
        <td>{{ row.sku }}</td>
        <td><strong>{{ row.name }}</strong></td>
        <td>{{ row.categoryName }}</td>
        <td nzAlign="right">Rs. {{ row.price }}</td>
        <td nzAlign="right">{{ row.quantityOnHand }}</td>
        <td nzAlign="right">{{ row.reorderLevel }}</td>
        <td>
          <nz-tag [nzColor]="row.isLowStock ? 'red' : 'green'">
            {{ row.isLowStock ? 'Low Stock' : 'In Stock' }}
          </nz-tag>
        </td>
        <td nzAlign="center">
          <button nz-button nzType="default" nzSize="small" (click)="openAdjustmentDrawer(row)">
            <i nz-icon nzType="swap"></i> Adjust
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>

  <nz-empty *ngIf="!filteredRows.length" nzNotFoundContent="No items match your search"></nz-empty>
</nz-card>
