<nz-card nzHoverable>
  <form nz-form [formGroup]="filterFormStructure">
    <nz-row [nzGutter]="[16, 16]" nzJustify="space-between" nzAlign="middle">
      <nz-col [nzSpan]="8">
        <input
          nz-input
          formControlName="search"
          placeholder="Search products"
        />
      </nz-col>
    </nz-row>
  </form>
</nz-card>

<div class="kanban-board mt-3">
  <div class="kanban-column" *ngFor="let column of columns">
    <div class="kanban-column-header">
      <span class="kanban-column-title">{{ column.label }}</span>
      <span class="kanban-column-count">{{ column.products.length }}</span>
      <button
        nz-button
        nzType="text"
        nzSize="small"
        nz-tooltip
        nzTooltipTitle="Add product"
        (click)="openCreateDrawer(column.id)"
      >
        <i nz-icon nzType="plus"></i>
      </button>
    </div>

    <div class="kanban-column-body">
      <nz-card
        *ngFor="let product of column.products"
        class="kanban-card"
        [nzBordered]="true"
        nzSize="small"
      >
        <div class="kanban-card-header">
          <span class="kanban-card-name">{{ product.name }}</span>
          <nz-tag [nzColor]="product.status ? 'green' : 'red'">
            {{ product.status ? 'Active' : 'Inactive' }}
          </nz-tag>
        </div>

        <div class="kanban-card-meta">
          <span>SKU: {{ product.sku }}</span>
          <span>{{ product.type }}</span>
        </div>

        <div class="kanban-card-price">Rs. {{ product.price }}</div>

        <div class="kanban-card-actions">
          <button
            nz-button
            nzType="text"
            nzSize="small"
            nz-tooltip
            nzTooltipTitle="Edit"
            (click)="openEditDrawer(product)"
          >
            <i nz-icon nzType="edit"></i>
          </button>
          <button
            nz-button
            nzType="text"
            nzSize="small"
            nzDanger
            nz-tooltip
            nzTooltipTitle="Delete"
            (click)="deleteProduct(product)"
          >
            <i nz-icon nzType="delete"></i>
          </button>
        </div>
      </nz-card>

      <div class="kanban-empty" *ngIf="!column.products.length">
        No products in this category
      </div>
    </div>
  </div>
</div>
