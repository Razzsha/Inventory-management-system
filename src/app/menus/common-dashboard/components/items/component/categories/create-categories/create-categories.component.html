<form nz-form [formGroup]="form" (ngSubmit)="submit()">
  <nz-form-item>
    <nz-form-label nzRequired>Category Name</nz-form-label>
    <nz-form-control nzErrorTip="Name is required">
      <input nz-input formControlName="name" placeholder="e.g. Cold Drinks" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Description</nz-form-label>
    <nz-form-control>
      <textarea
        nz-input
        formControlName="description"
        rows="4"
        placeholder="Optional description"
      ></textarea>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Active</nz-form-label>
    <nz-form-control>
      <nz-switch formControlName="isActive"></nz-switch>
    </nz-form-control>
  </nz-form-item>

  <div class="drawer-footer d-flex justify-content-end">
    <button nz-button type="button" (click)="cancel()" class="mr-2">Cancel</button>
    <button nz-button nzType="primary" type="submit" nzSpaceItem [nzLoading]="submitting">
      {{ mode === 'edit' ? 'Update' : 'Create' }}
    </button>
  </div>
</form>
