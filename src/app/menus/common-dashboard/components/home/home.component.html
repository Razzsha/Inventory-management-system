<div>
  <!-- Dashboard Header -->
  <nz-row [nzGutter]="[16, 16]" nzAlign="middle" nzJustify="space-between">
    <nz-col [nzXs]="24" [nzMd]="16">
      <h2 nz-typography>Inventory Dashboard</h2>
      <p nz-typography nzType="secondary">
        Overview of your inventory and business activities
      </p>
    </nz-col>
  </nz-row>

  <br />

  <!-- Statistics -->
  <nz-row [nzGutter]="[16, 16]">
    <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
      <nz-card>
        <nz-statistic nzTitle="Total Items" [nzValue]="totalItems" [nzPrefix]="itemIcon"></nz-statistic>
        <ng-template #itemIcon><i nz-icon nzType="appstore"></i></ng-template>
      </nz-card>
    </nz-col>

    <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
      <nz-card>
        <nz-statistic nzTitle="Categories" [nzValue]="totalCategories" [nzPrefix]="categoryIcon"></nz-statistic>
        <ng-template #categoryIcon><i nz-icon nzType="folder"></i></ng-template>
      </nz-card>
    </nz-col>

    <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
      <nz-card>
        <nz-statistic
          nzTitle="Low Stock"
          [nzValue]="lowStockCount"
          [nzPrefix]="warningIcon"
          [nzValueStyle]="{ color: lowStockCount > 0 ? '#dc2626' : undefined }"
        ></nz-statistic>
        <ng-template #warningIcon><i nz-icon nzType="warning"></i></ng-template>
      </nz-card>
    </nz-col>

    <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="6">
      <nz-card>
        <nz-statistic
          nzTitle="Total Inventory Value"
          [nzValue]="totalInventoryValue"
          nzPrefix="Rs."
          [nzValueStyle]="{ fontSize: '20px' }"
        ></nz-statistic>
      </nz-card>
    </nz-col>
  </nz-row>

  <br />

  <!-- Inventory + Category Breakdown -->
  <nz-row [nzGutter]="[16, 16]">
    <nz-col [nzXs]="24" [nzLg]="16">
      <nz-card nzTitle="Inventory Overview">
        <form nz-form [formGroup]="filterForm">
          <nz-form-item>
            <nz-form-control>
              <nz-input-group nzPrefixIcon="search">
                <input nz-input formControlName="search" placeholder="Search item, SKU or category" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
        </form>

        <nz-table
          #inventoryTable
          [nzData]="filteredItems"
          [nzPageSize]="5"
          nzSize="middle"
          [nzScroll]="{ x: '700px' }"
        >
          <thead>
            <tr>
              <th>SKU</th>
              <th>Item</th>
              <th>Category</th>
              <th nzAlign="right">Price</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of inventoryTable.data">
              <td>{{ item.sku }}</td>
              <td><strong>{{ item.name }}</strong></td>
              <td>{{ item.categoryName }}</td>
              <td nzAlign="right">Rs. {{ item.price }}</td>
              <td>
                <nz-tag [nzColor]="item.status ? 'green' : 'red'">
                  {{ item.status ? 'Active' : 'Inactive' }}
                </nz-tag>
              </td>
            </tr>
          </tbody>
        </nz-table>

        <nz-empty *ngIf="!filteredItems.length" nzNotFoundContent="No items match your search"></nz-empty>
      </nz-card>
    </nz-col>

    <nz-col [nzXs]="24" [nzLg]="8">
      <nz-card nzTitle="Items by Category">
        <ng-container *ngFor="let cat of categoryBreakdown; let last = last">
          <nz-row nzJustify="space-between">
            <nz-col><span>{{ cat.name }}</span></nz-col>
            <nz-col><strong>{{ cat.count }} items</strong></nz-col>
          </nz-row>
          <nz-progress [nzPercent]="cat.percent"></nz-progress>
          <br *ngIf="!last" />
        </ng-container>

        <nz-empty *ngIf="!categoryBreakdown.length" nzNotFoundContent="No categories yet"></nz-empty>
      </nz-card>
    </nz-col>
  </nz-row>
</div>
